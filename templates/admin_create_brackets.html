<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Brackets - NYIT Badminton</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="logo">🏸 <span>Team</span> Manager</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/dashboard">Dashboard</a>
                <a href="/admin" class="admin-link">⭐ Admin</a>
                <a href="/logout" class="logout-link">🚪 Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="section">
            <h2>🏆 Create Brackets</h2>
            
            <div style="max-width: 700px;">
                <form method="POST" class="card">
                    <h3>New Match</h3>
                    
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" name="match_date" required>
                    </div>
                    <div class="form-group">
                        <label>Time</label>
                        <input type="time" name="match_time" required>
                    </div>
                    <div class="form-group">
                        <label>Round</label>
                        <input type="number" name="bracket_round" value="1" min="1">
                    </div>

                    <h4 style="margin-top: 20px;">Team 1</h4>
                    <div class="form-group">
                        <label>Player 1</label>
                        <select name="team1_p1" required>
                            <option value="">Select player</option>
                            {% for player in players %}
                                <option value="{{ player.full_name }}">{{ player.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Player 2 (Optional)</label>
                        <select name="team1_p2">
                            <option value="">Select player</option>
                            {% for player in players %}
                                <option value="{{ player.full_name }}">{{ player.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <h4 style="margin-top: 20px;">Team 2</h4>
                    <div class="form-group">
                        <label>Player 1</label>
                        <select name="team2_p1" required>
                            <option value="">Select player</option>
                            {% for player in players %}
                                <option value="{{ player.full_name }}">{{ player.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Player 2 (Optional)</label>
                        <select name="team2_p2">
                            <option value="">Select player</option>
                            {% for player in players %}
                                <option value="{{ player.full_name }}">{{ player.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <button type="submit" class="btn-primary" style="background: linear-gradient(135deg, #FFD700, #F59E0B); color: #1A1A2E; margin-top: 20px; width: 100%; padding: 15px; font-size: 18px;">
                        🏆 Create Match
                    </button>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>🏸 NYIT Badminton Team Manager &bull; New York Institute of Technology</p>
        </div>
    </footer>
</body>
</html>
