{% extends "base.html" %}

{% block title %}Admin Rate Player - NYIT Badminton{% endblock %}

{% block content %}
    <div class="container">
        <div class="section">
            <h2 style="text-align: center; margin-bottom: 40px;">⭐ Official Player Evaluation</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px;">Admin-level performance rating for team development</p>

            <div style="max-width: 600px; margin: 0 auto;">
                <form method="POST" class="card">
                    <h3 style="text-align: center; margin-bottom: 20px;">Evaluation Details</h3>

                    <div class="form-group">
                        <label>Select Player</label>
                        <select name="player_id" required>
                            <option value="">Choose a player</option>
                            {% for player in players %}
                                <option value="{{ player.id }}">{{ player.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Match (Optional)</label>
                        <select name="match_id">
                            <option value="">General Evaluation</option>
                            {% for match in matches %}
                                <option value="{{ match.id }}">{{ match.match_date }} - {{ match.team1_player1 }} vs {{ match.team2_player1 }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px;">
                        <div class="form-group">
                            <label>Smash Accuracy (1-5)</label>
                            <input type="number" name="smash_accuracy" required min="1" max="5">
                        </div>
                        <div class="form-group">
                            <label>Net Play (1-5)</label>
                            <input type="number" name="net_play" required min="1" max="5">
                        </div>
                        <div class="form-group">
                            <label>Footwork (1-5)</label>
                            <input type="number" name="footwork" required min="1" max="5">
                        </div>
                        <div class="form-group">
                            <label>Consistency (1-5)</label>
                            <input type="number" name="consistency" required min="1" max="5">
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label>Shot Variety (1-5)</label>
                            <input type="number" name="shot_variety" required min="1" max="5">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Professional Comments</label>
                        <textarea name="comments" rows="4" placeholder="Provide constructive feedback..."></textarea>
                    </div>

                    <button type="submit" class="btn-primary" style="width: 100%; padding: 15px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 50px;">
                        Submit Official Rating
                    </button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
